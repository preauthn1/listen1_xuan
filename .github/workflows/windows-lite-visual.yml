name: Windows Lite visual verification

on:
  push:
    branches: [verify/windows-lite-edc127d]

permissions:
  contents: read
  actions: read

jobs:
  visual:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download existing Windows Lite artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = 'https://api.github.com/repos/preauthn1/listen1_xuan/actions/artifacts/14724783527/zip'
          Invoke-WebRequest -Headers $headers -Uri $url -OutFile artifact.zip
          New-Item -ItemType Directory -Force app | Out-Null
          Expand-Archive -Path artifact.zip -DestinationPath app -Force
          if (-not (Test-Path app/listen1_xuan.exe)) { throw 'Artifact executable missing' }
      - name: Launch app and capture default and wide settings screenshots
        shell: powershell
        run: .github/scripts/capture_windows_settings.ps1
      - name: Upload cropped app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-lite-visual-screenshots
          path: visual_output/*.png
          if-no-files-found: error
