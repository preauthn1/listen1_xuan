name: Build android artifacts

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      GOOGLE_SERVICES_JSON_B64:
        required: false
      KEYSTORE_BASE64:
        # Forks do not receive the upstream release key.  Keep this optional so
        # the caller can be evaluated and the Android job can be skipped safely.
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      SUPABASE_PROXY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  signing_gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      ALL_KEYS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
      ANY_KEY: ${{ secrets.KEYSTORE_BASE64 != '' || secrets.KEYSTORE_PASSWORD != '' || secrets.KEY_ALIAS != '' || secrets.KEY_PASSWORD != '' }}
      FORK: ${{ github.event.repository.fork }}
    steps:
      - id: check
        shell: bash
        run: |
          # An unsigned fork must not silently become a debug-signed release.
          if [[ "$ALL_KEYS" == true ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          # Forks without any key skip on branch pushes and manual runs; a tag (release) still fails loudly.
          elif [[ "$ANY_KEY" == false && "$FORK" == true && "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Fork has no Android signing secrets; no APK will be built or published.'
          else
            echo '::error::Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD for signed Android artifacts.'
            exit 1
          fi

  build:
    needs: signing_gate
    # Never substitute a debug/ephemeral key for a release build.  A fork with
    # no signing secrets gets a clean skip instead of a workflow-evaluation
    # failure with zero steps; a configured release build still runs normally.
    if: ${{ needs.signing_gate.outputs.ready == 'true' }}
    env:
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # artifact 名固定不含 hash：同一分支重跑会覆盖同名 artifact，
    # 这与原 workflow 行为一致，但也意味着并行的两批 run 会互相覆盖，
    # 因此 concurrency 取消旧 run 是必要的。
    strategy:
      fail-fast: false
      matrix:
        # infix 为插在 `app-<abi>-release` 与 `-<hash>.apk` 之间的完整字符串
        # （含前导 `-`，可为空）。artifact 名 = 同一中缀但去掉 `-<hash>`，
        # 因此只需 infix 一个字段就能同时复刻文件名与 artifact 名。
        include:
          - { ffmpeg: with,    cronet: default, infix: "-without embedded Cronet-ffmpeg", extra-define: "" }
          - { ffmpeg: with,    cronet: noplay,  infix: "-ffmpeg",                          extra-define: "--dart-define=cronetHttpNoPlay=true" }
          - { ffmpeg: without, cronet: default, infix: "-without embedded Cronet",         extra-define: "" }
          - { ffmpeg: without, cronet: noplay,  infix: "",                                 extra-define: "--dart-define=cronetHttpNoPlay=true" }
    steps:
      - name: Output Commit Information
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          echo "触发此次action的提交ID: $COMMIT_SHA"
          echo "提交信息: $COMMIT_MESSAGE"
          echo "提交作者: $COMMIT_AUTHOR"
          GITHASH="${COMMIT_SHA:0:7}"
          echo "GITHASH=$GITHASH" >> "$GITHUB_ENV"
          echo "SUPABASE_PROXY_TOKEN=${{ secrets.SUPABASE_PROXY_TOKEN }}" >> "$GITHUB_ENV"
          echo "GITHASH (前7位): $GITHASH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Firebase Android configuration
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' }}
        run: python3 scripts/restore_android_firebase.py

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      # cache: true 缓存 Flutter SDK，matrix 并行时每个 job 都能命中。
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          flutter-version: "3.41.9"
          cache: true

      # 复用 Gradle 依赖缓存（各 job 独立 key，互不阻塞）。
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: false

      - run: flutter --version
      - name: Use real Android Firebase SDKs
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' }}
        run: python3 scripts/configure_build.py firebase real

      - name: Use stub Firebase dependencies when Android secret is absent
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 == '' }}
        run: python3 scripts/configure_build.py firebase stub

      - name: Switch FFmpeg config (${{ matrix.ffmpeg }})
        run: bash scripts/build.sh ${{ matrix.ffmpeg }}

      - run: flutter pub get
      - name: Verify real Android Firebase plugins
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' }}
        run: python3 scripts/verify_firebase_dependencies.py real

      - name: 解码生成 jks
        run: |
          set -eu
          umask 077
          # Secrets pasted from Windows/certutil may contain CR/LF or spaces.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/xuan.jks
          test -s android/app/xuan.jks
          chmod 600 android/app/xuan.jks
          keytool -exportcert -alias "$KEY_ALIAS" -keystore android/app/xuan.jks \
            -storepass:env KEYSTORE_PASSWORD > "$RUNNER_TEMP/android-release.der"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      # 先编译 AOT，后续二次 build 复用 kernel_snapshot 产物。
      - name: flutter build apk --split-per-abi (${{ matrix.ffmpeg }}/${{ matrix.cronet }})
        run: >-
          flutter build apk --release --split-per-abi
          ${{ matrix.extra-define }}
          --dart-define=gitHash=${{ env.GITHASH }}
          --dart-define=SUPABASE_PROXY_TOKEN=${{ secrets.SUPABASE_PROXY_TOKEN }}
        env:
          KEYSTORE: xuan.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Stash split APKs
        run: |
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "out/app-$abi-release${{ matrix.infix }}-${GITHASH}.apk"
          done
        shell: bash

      - name: flutter build apk (universal, ${{ matrix.ffmpeg }}/${{ matrix.cronet }})
        run: >-
          flutter build apk --release
          ${{ matrix.extra-define }}
          --dart-define=gitHash=${{ env.GITHASH }}
          --dart-define=SUPABASE_PROXY_TOKEN=${{ secrets.SUPABASE_PROXY_TOKEN }}
        env:
          KEYSTORE: xuan.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Stash universal APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "out/app-release${{ matrix.infix }}-${GITHASH}.apk"
        shell: bash

      - name: List produced APKs
        run: ls -l out/

      - name: Verify release APK signatures
        shell: bash
        run: |
          set -euo pipefail
          signer=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)
          test -x "$signer"
          digest=$(sha256sum "$RUNNER_TEMP/android-release.der" | cut -d' ' -f1)
          for apk in out/*.apk; do
            verified=$("$signer" verify --print-certs "$apk")
            grep -Ei "^(Signer #1|V[0-9.]+ Signer)(:)? certificate SHA-256 digest: ${digest}$" <<< "$verified"
          done

      # 每个变体上传 4 个压缩 ZIP artifact（不带 hash）。
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-arm64-v8a-release${{ matrix.infix }}.zip
          path: out/app-arm64-v8a-release${{ matrix.infix }}-${{ env.GITHASH }}.apk
          if-no-files-found: error
          compression-level: 9

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-armeabi-v7a-release${{ matrix.infix }}.zip
          path: out/app-armeabi-v7a-release${{ matrix.infix }}-${{ env.GITHASH }}.apk
          if-no-files-found: error
          compression-level: 9

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-x86_64-release${{ matrix.infix }}.zip
          path: out/app-x86_64-release${{ matrix.infix }}-${{ env.GITHASH }}.apk
          if-no-files-found: error
          compression-level: 9

      - name: Upload universal APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release${{ matrix.infix }}.zip
          path: out/app-release${{ matrix.infix }}-${{ env.GITHASH }}.apk
          if-no-files-found: error
          compression-level: 9


  publish:
    # Manual CI checks produce artifacts without replacing published releases.
    # Tags publish everywhere. On the upstream repository a push to main or
    # feat/dual-build-ffmpeg also publishes to the release named after the
    # pubspec version (upstream behaviour); forks stay tag-only.
    if: >-
      (github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_call')) ||
      (github.repository == 'HBWuChang/listen1_xuan' && github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/dual-build-ffmpeg'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pattern 需同时覆盖 `app-<abi>-release...` 与 `app-release...`（universal）。
      - name: Download all Android artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-*release*.zip
          merge-multiple: true
          path: release_artifacts

      - name: List merged assets
        run: |
          ls -l release_artifacts/
          python3 - <<'PYCOUNT'
          from pathlib import Path
          print(f"共 {len(list(Path('release_artifacts').glob('*.apk')))} 个 APK")
          PYCOUNT

      # Release ZIP contains the unchanged signed APK, with the same file stem.
      - name: Compress APKs for Release
        run: |
          python3 - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          for apk in Path("release_artifacts").glob("*.apk"):
              with ZipFile(apk.with_suffix(".zip"), "w", ZIP_DEFLATED, compresslevel=9) as archive:
                  archive.write(apk, apk.name)
          PYZIP

      # Single source of truth: the release is always named after the pubspec
      # version; a tag build must push exactly that tag.
      - name: Extract Version from pubspec.yaml
        id: extract_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pubspec.yaml version '$version'."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION=$version"

      # 删除该 Release 下旧的 Android APK / ZIP（保留其他平台 ZIP）
      - name: Delete Old APK Assets from Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.VERSION }}" --json assets --jq '.assets[].name' \
            | grep -E '^app-.*\.(apk|zip)$' \
            | while read -r asset; do
                echo "Deleting old asset: $asset"
                gh release delete-asset "${{ env.VERSION }}" "$asset" --yes || true
              done

      # 上传新的资产到 Release（ffmpeg 版 + 精简版，各 8 个）
      - name: Upload New Asset to Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.VERSION }}
          prerelease: ${{ !contains(github.event.head_commit.message, 'sta') }}
          fail_on_unmatched_files: true
          files: |
            release_artifacts/*.apk
            release_artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
