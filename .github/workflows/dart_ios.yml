name: Build ios artifacts

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_PROXY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Output Commit Information
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          echo "触发此次action的提交ID: $COMMIT_SHA"
          echo "提交信息: $COMMIT_MESSAGE"
          echo "提交作者: $COMMIT_AUTHOR"
          GITHASH="${COMMIT_SHA:0:7}"
          echo "GITHASH=$GITHASH" >> $GITHUB_ENV
          echo "SUPABASE_PROXY_TOKEN=${{ secrets.SUPABASE_PROXY_TOKEN }}" >> $GITHUB_ENV
          echo "GITHASH (前7位): $GITHASH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.3.0'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'

      - run: flutter --version
      - name: Exclude Firebase SDKs from this platform
        run: python3 scripts/configure_build.py firebase stub
      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python3 scripts/verify_firebase_dependencies.py stub

      # ============ 第一遍: 带 FFmpeg 版本 ============
      # 切换为带 FFmpeg 配置（默认，幂等）
      - name: Switch to FFmpeg-enabled config
        run: bash scripts/build.sh with

      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python3 scripts/verify_firebase_dependencies.py stub

      # 安装 CocoaPods 依赖
      - name: Install CocoaPods dependencies (ffmpeg)
        run: |
          cd ios
          pod install
      - name: Verify CocoaPods excludes Firebase
        run: python3 scripts/verify_firebase_dependencies.py stub --native ios

      # 构建 iOS app (无签名版本，用于测试)
      - name: Build iOS app (no codesign, ffmpeg)
        run: flutter build ios --release --no-codesign --dart-define=gitHash=${{ env.GITHASH }} --dart-define=SUPABASE_PROXY_TOKEN=${{ secrets.SUPABASE_PROXY_TOKEN }}

      # 打包为 .app 文件
      - name: Create .app archive (ffmpeg)
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Runner.app.zip Payload
          mv Runner.app.zip ../../../listen1_xuan-ios-ffmpeg-${GITHASH}.app.zip
          cd ../../..

      # 上传 .app 文件
      - name: Upload .app artifact (ffmpeg)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-app-artifact-ffmpeg
          path: listen1_xuan-ios-ffmpeg-${{ env.GITHASH }}.app.zip

      # ============ 第二遍: 无 FFmpeg 精简版 ============
      - name: Switch to FFmpeg-free config
        run: bash scripts/build.sh without

      - run: flutter clean
      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python3 scripts/verify_firebase_dependencies.py stub

      # 安装 CocoaPods 依赖（无 ffmpeg 原生库）
      - name: Install CocoaPods dependencies (lite)
        run: |
          cd ios
          pod install
      - name: Verify CocoaPods excludes Firebase
        run: python3 scripts/verify_firebase_dependencies.py stub --native ios

      # 构建 iOS app (无签名版本，用于测试)
      - name: Build iOS app (no codesign, lite)
        run: flutter build ios --release --no-codesign --dart-define=gitHash=${{ env.GITHASH }} --dart-define=SUPABASE_PROXY_TOKEN=${{ secrets.SUPABASE_PROXY_TOKEN }}

      # 打包为 .app 文件
      - name: Create .app archive (lite)
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Runner.app.zip Payload
          mv Runner.app.zip ../../../listen1_xuan-ios-${GITHASH}.app.zip
          cd ../../..

      # 上传 .app 文件
      - name: Upload .app artifact (lite)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-app-artifact
          path: listen1_xuan-ios-${{ env.GITHASH }}.app.zip


  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_call') && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ios-app-artifact*
          merge-multiple: true
      - run: echo "GITHASH=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      # Single source of truth: the release is always named after the pubspec
      # version; a tag build must push exactly that tag.
      - name: Extract Version from pubspec.yaml
        id: extract_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pubspec.yaml version '$version'."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION=$version"

      - name: Debug Version
        run: echo "${{ env.VERSION }}"

      # 删除该 Release 下所有旧的 iOS 构建文件
      - name: Delete Old iOS Assets from Release
        run: |
          gh release view "${{ env.VERSION }}" --json assets --jq '.assets[].name' | grep -E 'listen1_xuan-ios-.+\.app\.zip$' | while read asset; do
            echo "Deleting old asset: $asset"
            gh release delete-asset "${{ env.VERSION }}" "$asset" --yes || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 上传到 Release（带 FFmpeg 版 + 精简版）
      - name: Upload New Asset to Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            listen1_xuan-ios-ffmpeg-${{ env.GITHASH }}.app.zip
            listen1_xuan-ios-${{ env.GITHASH }}.app.zip
          prerelease: ${{ !contains(github.event.head_commit.message, 'sta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
