name: Build macos artifacts

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_PROXY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    # 全部在 Intel 镜像（macos-15-intel）上编译：GitHub 的 macOS arm64 托管机
    # 容量紧张（官方注释 "capacity constraints"），作业常排队 20 分钟后被取消，
    # Intel 池几秒内即可分到。Xcode 可在 Intel 上交叉编译 arm64，产物的架构
    # 由下面的单架构校验（lipo -archs）逐个 Mach-O 文件检查。
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  tag: apple-silicon, runner: macos-15-intel, ffmpeg: with,    variant: ffmpeg, artifact: macos-app-artifact-ffmpeg }
          - { arch: x86_64, tag: intel,         runner: macos-15-intel, ffmpeg: with,    variant: ffmpeg, artifact: macos-app-artifact-ffmpeg }
          - { arch: arm64,  tag: apple-silicon, runner: macos-15-intel, ffmpeg: without, variant: lite,   artifact: macos-app-artifact }
          - { arch: x86_64, tag: intel,         runner: macos-15-intel, ffmpeg: without, variant: lite,   artifact: macos-app-artifact }
    steps:
      - name: Output Commit Information
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          echo "触发此次action的提交ID: $COMMIT_SHA"
          echo "提交信息: $COMMIT_MESSAGE"
          echo "提交作者: $COMMIT_AUTHOR"
          GITHASH="${COMMIT_SHA:0:7}"
          echo "GITHASH=$GITHASH" >> $GITHUB_ENV
          echo "SUPABASE_PROXY_TOKEN=${{ secrets.SUPABASE_PROXY_TOKEN }}" >> $GITHUB_ENV
          echo "GITHASH (前7位): $GITHASH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'

      - run: flutter --version
      - name: Exclude Firebase SDKs from this platform
        run: python3 scripts/configure_build.py firebase stub

      - name: Switch FFmpeg config (${{ matrix.ffmpeg }})
        run: bash scripts/build.sh ${{ matrix.ffmpeg }}

      - run: flutter pub get
      - name: Verify Firebase is replaced by Dart-only stubs
        run: python3 scripts/verify_firebase_dependencies.py stub

      - name: Install CocoaPods dependencies
        run: |
          cd macos
          pod install
      - name: Verify CocoaPods excludes Firebase
        run: python3 scripts/verify_firebase_dependencies.py stub --native macos

      - name: Replace GITHASH in distribute_options.yaml
        run: |
          sed -i '' "s/\$GITHASH/${{ env.GITHASH }}/g" distribute_options.yaml
        shell: bash

      - name: Build macOS app (${{ matrix.arch }})
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.arch }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: 'NO'
        run: |
          dart pub global activate fastforge
          fastforge release --name prod

      - name: Verify single-arch, extract version, rename asset
        id: rename
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/listen1_xuan.app"
          WANT="${{ matrix.arch }}"
          GOT=$(lipo -archs "$APP/Contents/MacOS/listen1_xuan")
          echo "main exe archs: $GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::expected $WANT, got $GOT"
            exit 1
          fi
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            a=$(lipo -archs "$f" 2>/dev/null || true)
            if [ "$a" != "$WANT" ]; then
              echo "::error::not single-arch: $f -> $a"
              bad=1
            fi
          done < <(find "$APP" -type f -print0)
          [ "$bad" -eq 0 ] || exit 1

          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [ "${{ matrix.variant }}" = "ffmpeg" ]; then
            NEW="listen1_xuan-$VERSION-macos-${{ matrix.tag }}-ffmpeg-$GITHASH.zip"
          else
            NEW="listen1_xuan-$VERSION-macos-${{ matrix.tag }}-$GITHASH.zip"
          fi
          mv "dist/$VERSION/listen1_xuan-$VERSION-macos.zip" "dist/$VERSION/$NEW"
          echo "ASSET_NAME=$NEW" >> $GITHUB_ENV
          # 用文件级路径上传：archive 根就是该文件名，下载后不会带版本子目录
          echo "asset_path=dist/$VERSION/$NEW" >> $GITHUB_OUTPUT
          echo "renamed -> $NEW"

      - name: Verify packaged app and updater permissions
        run: |
          set -euo pipefail
          CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "$CHECK_DIR"' EXIT
          /usr/bin/ditto -x -k "${{ steps.rename.outputs.asset_path }}" "$CHECK_DIR"
          APP="$CHECK_DIR/listen1_xuan.app"
          test -L "$APP/Contents/Frameworks/App.framework/Resources"
          test -f "$APP/Contents/Frameworks/App.framework/App"
          test -d "$APP/Contents/Frameworks/App.framework/Resources/flutter_assets"
          test -x "$APP/Contents/MacOS/listen1_xuan"
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/codesign -d --entitlements :- "$APP" > "$CHECK_DIR/entitlements.plist"
          SANDBOX=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$CHECK_DIR/entitlements.plist" 2>/dev/null || true)
          if [ "$SANDBOX" = "true" ]; then
            echo "::error::Direct-distribution updater cannot run inside App Sandbox"
            exit 1
          fi

      - name: Upload artifact (${{ matrix.tag }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ matrix.tag }}
          path: ${{ steps.rename.outputs.asset_path }}
          if-no-files-found: error


  publish:
    # Tags publish everywhere. On the upstream repository a push to main or
    # feat/dual-build-ffmpeg also publishes to the release named after the
    # pubspec version (upstream behaviour); forks stay tag-only.
    if: >-
      (github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_call')) ||
      (github.repository == 'HBWuChang/listen1_xuan' && github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/dual-build-ffmpeg'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-app-artifact-*
          merge-multiple: true
          path: dist-assets

      # upload-artifact 会保留搜索路径的共同父目录（版本号目录），这里拍平。
      - name: Flatten downloaded assets
        run: |
          set -euo pipefail
          echo "--- before ---"
          find dist-assets -type f | sort
          find dist-assets -mindepth 2 -type f -name '*.zip' -exec mv -f {} dist-assets/ \;
          find dist-assets -mindepth 1 -type d -empty -delete
          echo "--- after ---"
          ls -l dist-assets/*.zip

      # Single source of truth: the release is always named after the pubspec
      # version; a tag build must push exactly that tag.
      - name: Extract Version from pubspec.yaml
        id: extract_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pubspec.yaml version '$version'."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION=$version"

      - name: Delete Old macOS Assets from Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.VERSION }}" --json assets --jq '.assets[].name' \
            | grep -E 'listen1_xuan-.+-macos-.+\.zip$' \
            | while read -r asset; do
                echo "Deleting old asset: $asset"
                gh release delete-asset "${{ env.VERSION }}" "$asset" --yes || true
              done

      - name: Upload New Assets to Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.VERSION }}
          files: dist-assets/*.zip
          fail_on_unmatched_files: true
          prerelease: ${{ !contains(github.event.head_commit.message, 'sta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
